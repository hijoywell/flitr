distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 官方源: 在云服务器上实测 145 MB/s, 通用性最好。
# 国内 Windows 慢链路如果卡住, 可临时换成镜像:
#   https\://mirrors.cloud.tencent.com/gradle/gradle-9.9.1-bin.zip
distributionUrl=https\://services.gradle.org/distributions/gradle-9.9.1-bin.zip
# 慢链路下 10s 的读超时会让下载在 80% 处断开, 放宽到 60s
networkTimeout=60000
retries=1
retryBackOffMs=1000
validateDistributionUrl=false
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
