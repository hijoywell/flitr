name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # 打 tag 时需要创建 Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 本项目需要 API 37（Android 17），runner 上通常没有，必须显式安装。
      # 新老版本的 sdkmanager 路径不同，所以做了回退。
      - name: Install Android SDK packages
        run: |
          set -e
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR="sdkmanager"; fi
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          echo "已安装:"
          ls "$ANDROID_HOME/platforms"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      # 签名密钥不进仓库，从 Secrets 还原。
      # 没配 secrets（例如 fork、PR）时回退 debug 签名，构建仍然能跑通。
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FLITR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FLITR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLITR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FLITR_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置签名 secrets，本次构建回退 debug 签名，产物不可用于升级安装"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/flitr-release.jks"
          {
            echo "FLITR_KEYSTORE_FILE=$RUNNER_TEMP/flitr-release.jks"
            echo "FLITR_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "FLITR_KEY_ALIAS=$KEY_ALIAS"
            echo "FLITR_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "已从 Secrets 还原签名密钥"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      # 配了密钥却还是 debug 签名，说明 secrets 没生效，必须让构建失败而不是发个坏包出去
      - name: Verify signature
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK" | tee /tmp/certs.txt
          if [ -n "$FLITR_KEYSTORE_FILE" ]; then
            if grep -q "CN=Android Debug" /tmp/certs.txt; then
              echo "::error::已配置签名 secrets，但产物仍是 debug 签名"
              exit 1
            fi
            echo "签名校验通过：使用 release 密钥"
          else
            echo "::warning::本次产物为 debug 签名，仅供自测"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flitr-${{ github.ref_name }}-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # 只在打 tag（v*）时发布 Release，普通推送只出 artifact
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          NAME=$(basename "$APK")
          case "$NAME" in
            Flitr-*) ;;
            *) echo "::error::产物命名不符合规范（应为 Flitr-<版本>-android-<abi>.apk）: $NAME"; exit 1 ;;
          esac
          echo "发布: ${GITHUB_REF_NAME}  产物: $NAME ($(du -h "$APK" | cut -f1))"
          gh release create "${GITHUB_REF_NAME}" "$APK" \
            --title "Flitr ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md
          echo "Release 已创建: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}"
